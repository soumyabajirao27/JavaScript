<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM PIN Strength Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .student-header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            padding: 12px 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }
        .student-header .name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .student-header .prn {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 3px;
        }
        .atm-card {
            width: 400px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            padding: 35px 30px;
            text-align: center;
        }
        .bank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .bank-logo {
            font-size: 20px;
            font-weight: 700;
            color: #2c5364;
            letter-spacing: 1px;
        }
        .bank-chip {
            background: linear-gradient(135deg, #d4af37, #f5d061);
            width: 40px;
            height: 30px;
            border-radius: 6px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #0f2027;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: #7a8a99;
            margin-bottom: 25px;
        }
        .pin-box {
            background: #f4f7f9;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .pin-input {
            width: 100%;
            padding: 14px;
            font-size: 28px;
            letter-spacing: 12px;
            text-align: center;
            border: none;
            outline: none;
            background: transparent;
            color: #0f2027;
            font-weight: 700;
        }
        .pin-input::placeholder {
            letter-spacing: 2px;
            font-size: 16px;
            color: #b0bcc6;
            font-weight: 400;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #2c5364, #0f2027);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-bottom: 20px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 32, 39, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .result-box {
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            background: #f4f7f9;
            transition: all 0.3s ease;
        }
        .result-box.weak {
            background: #fff3e0;
            color: #e65100;
        }
        .result-box.strong {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .result-box.invalid {
            background: #ffebee;
            color: #c62828;
        }
        .result-box.empty {
            background: #f4f7f9;
            color: #7a8a99;
        }
        .hint {
            margin-top: 15px;
            font-size: 12px;
            color: #b0bcc6;
        }
    </style>
</head>
<body>

    <div class="student-header">
        <div class="name">Soumya Bajirao</div>
        <div class="prn">PRN: 24070521146</div>
    </div>

    <div class="atm-card">
        <div class="bank-header">
            <div class="bank-logo">💳 PIN Guard</div>
            <div class="bank-chip"></div>
        </div>

        <div class="title">ATM PIN Strength Checker</div>
        <div class="subtitle">Enter your PIN to check its strength</div>

        <div class="pin-box">
            <input type="password" id="pin" class="pin-input"
                   placeholder="Enter your PIN" maxlength="12"
                   inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        </div>

        <button class="btn" onclick="checkStrength()">Check PIN</button>

        <div id="result" class="result-box empty">Enter a PIN to see its strength</div>

        <div class="hint">🔒 Numbers only · A palindrome PIN is weak</div>
    </div>

    <script>
        // Core validation logic
        function validatePin(pin) {
            // 1. Remove spaces
            let cleanText = pin.replace(/\s/g, '');

            // 2. Only numbers are allowed
            if (cleanText === '' || !/^[0-9]+$/.test(cleanText)) {
                return "Invalid: PIN must contain only numbers.";
            }

            // 3. Reverse the string
            let reversedText = cleanText.split('').reverse().join('');

            // 4. Evaluate strength
            if (cleanText === reversedText) {
                return "Weak PIN";
            }

            return "Strong PIN";
        }

        // Wire the logic to the UI
        function checkStrength() {
            let input = document.getElementById("pin").value;
            let result = validatePin(input);
            let box = document.getElementById("result");

            box.className = "result-box";

            if (result.startsWith("Invalid")) {
                box.classList.add("invalid");
                box.innerText = result;
            } else if (result === "Weak PIN") {
                box.classList.add("weak");
                box.innerText = "⚠️ " + result + " — A palindrome PIN is easy to guess!";
            } else {
                box.classList.add("strong");
                box.innerText = "✅ " + result + " — Your PIN is secure!";
            }
        }

        // --- Test Cases (console) ---
        console.log(validatePin("12321"));      // Output: Weak PIN (palindrome)
        console.log(validatePin("12345"));      // Output: Strong PIN
        console.log(validatePin("Secret123"));  // Output: Invalid (not numbers only)
        console.log(validatePin("Racecar"));    // Output: Invalid (not numbers only)
    </script>

</body>
</html>
